<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Oilkhajo</title>
    <link rel="stylesheet" href="stylecha.css">
</head>
<body class="login-body">
    <div class="login-card">
        <img src="cha.png" alt="Oilkhajo Logo" class="login-logo">
        <h2>เข้าสู่ระบบ Oilkhajo</h2>
        <p>ยินดีต้อนรับสู่ร้านบุฟเฟต์ Oilkhajo</p>
        <form action="homecha.html" method="GET" class="login-form">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้งาน / อีเมล</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้หรืออีเมล" required>
            </div>
            <div class="input-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
        </form>
    </div>
</body>
</html>
